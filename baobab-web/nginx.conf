server {
  listen ${PORT};
  root /usr/share/nginx/html;
  index index.html;

  # Pages du site (/login, /tree, ...) : toujours renvoyer index.html
  location / {
    try_files $uri /index.html;
  }

  # Fichiers générés par le build : cache long
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
