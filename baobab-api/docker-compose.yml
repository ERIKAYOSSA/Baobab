services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/Projet_2026
    volumes:
      - neo4j_data:/data

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: Projet_2026
      JWT_SECRET: baobab-docker-secret-change-me
      JWT_EXPIRES_IN: 7d
    depends_on:
      - neo4j

volumes:
  neo4j_data:
